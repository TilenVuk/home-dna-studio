name: Generate responsive hero assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate responsive WebP images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path('src/assets/hero-interior.jpg')
          image = Image.open(source).convert('RGB')

          for width in (768, 1280, 1920):
              target = Path(f'src/assets/hero-interior-{width}.webp')
              resized = image.copy()
              if resized.width > width:
                  height = round(resized.height * width / resized.width)
                  resized = resized.resize((width, height), Image.Resampling.LANCZOS)
              resized.save(target, 'WEBP', quality=82, method=6, optimize=True)
              print(f'{target}: {target.stat().st_size} bytes')
          PY

      - name: Commit generated assets
        run: |
          if git diff --quiet -- src/assets/hero-interior-768.webp src/assets/hero-interior-1280.webp src/assets/hero-interior-1920.webp; then
            echo 'Hero WebP assets already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/hero-interior-768.webp src/assets/hero-interior-1280.webp src/assets/hero-interior-1920.webp
          git commit -m 'chore: add responsive WebP hero assets'
          git push
