name: One-time performance benchmark

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  benchmark:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Allow production deployment to settle
        run: sleep 120

      - name: Verify optimized production is live
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error --location --max-time 30 https://nuvelistudio.com/)"
          echo "$html" | grep -q '\.webp' || { echo 'Responsive WebP assets are not live yet.'; exit 1; }
          echo "$html" | grep -q 'nuveli-google-fonts' || { echo 'Async font loader is not live yet.'; exit 1; }

      - name: Run Lighthouse 13 benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results

          for run in 1 2; do
            npx --yes lighthouse@13.3.0 https://nuvelistudio.com/ \
              --output=json \
              --output-path="benchmark-results/home-${run}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox" \
              --quiet

            npx --yes lighthouse@13.3.0 https://nuvelistudio.com/home-dna \
              --output=json \
              --output-path="benchmark-results/home-dna-${run}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox" \
              --quiet
          done

      - name: Write benchmark summary
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const files = fs.readdirSync('benchmark-results').filter((name) => name.endsWith('.json'));
          const reports = files.map((name) => JSON.parse(fs.readFileSync(path.join('benchmark-results', name), 'utf8')));
          const groups = new Map();

          for (const report of reports) {
            const url = report.finalDisplayedUrl || report.finalUrl || report.requestedUrl;
            const group = groups.get(url) || [];
            group.push(report);
            groups.set(url, group);
          }

          const median = (values) => {
            const sorted = values.filter((value) => typeof value === 'number').sort((a, b) => a - b);
            if (!sorted.length) return null;
            const middle = Math.floor(sorted.length / 2);
            return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
          };

          const result = {
            generatedAt: new Date().toISOString(),
            lighthouseVersion: reports[0]?.lighthouseVersion ?? null,
            pages: {},
          };

          for (const [url, pageReports] of groups) {
            result.pages[url] = {
              performance: median(pageReports.map((r) => r.categories?.performance?.score ?? null)),
              seo: median(pageReports.map((r) => r.categories?.seo?.score ?? null)),
              accessibility: median(pageReports.map((r) => r.categories?.accessibility?.score ?? null)),
              bestPractices: median(pageReports.map((r) => r.categories?.['best-practices']?.score ?? null)),
              fcpMs: median(pageReports.map((r) => r.audits?.['first-contentful-paint']?.numericValue ?? null)),
              lcpMs: median(pageReports.map((r) => r.audits?.['largest-contentful-paint']?.numericValue ?? null)),
              tbtMs: median(pageReports.map((r) => r.audits?.['total-blocking-time']?.numericValue ?? null)),
              cls: median(pageReports.map((r) => r.audits?.['cumulative-layout-shift']?.numericValue ?? null)),
              speedIndexMs: median(pageReports.map((r) => r.audits?.['speed-index']?.numericValue ?? null)),
            };
          }

          fs.writeFileSync('performance-after.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(fs.readFileSync('performance-after.json', 'utf8'));
          NODE

      - name: Commit benchmark summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add performance-after.json
          git commit -m 'chore: record post-optimization Lighthouse benchmark'
          git push
