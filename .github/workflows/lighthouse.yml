name: Lighthouse SEO audit

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit production site
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Allow production deployment to settle
        if: github.event_name == 'push'
        run: sleep 90

      - name: Verify production site is reachable
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --location --max-time 20 https://nuvelistudio.com/ > /dev/null; then
              echo "Production site is reachable."
              exit 0
            fi
            echo "Attempt ${attempt}/10 failed; retrying in 15 seconds..."
            sleep 15
          done
          echo "Production site was not reachable in time."
          exit 1

      - name: Check production SEO metadata
        run: node scripts/check-production-seo-meta.mjs

      - name: Run Lighthouse 13 audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-results

          for run in 1 2; do
            npx --yes lighthouse@13.3.0 https://nuvelistudio.com/ \
              --output=json \
              --output-path="lighthouse-results/home-${run}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox" \
              --quiet

            npx --yes lighthouse@13.3.0 https://nuvelistudio.com/home-dna \
              --output=json \
              --output-path="lighthouse-results/home-dna-${run}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox" \
              --quiet
          done

      - name: Check Lighthouse thresholds
        run: node scripts/check-lighthouse-results.mjs lighthouse-results

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results/*.json
          if-no-files-found: warn
          retention-days: 14
